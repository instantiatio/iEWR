# Compatibility only: full website code and content live in instantiatio/ewr.
name: website-redirects

on:
  push:
    branches: [main]
    paths: ['.github/workflows/website-pages.yml']
  pull_request:
    paths: ['.github/workflows/website-pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: instantiatio/ewr
          ref: 52c4f27aae7af4b3567b5eb939c7c56d341a9244
          path: website-source
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Build legacy redirects and compatible downloads
        run: python website-source/legacy/build.py
      - name: Check redirect targets and evidence
        run: python website-source/legacy/check.py
      - name: Upload checked redirect artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: website-source/legacy/site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish legacy redirects
        id: deployment
        uses: actions/deploy-pages@v4
